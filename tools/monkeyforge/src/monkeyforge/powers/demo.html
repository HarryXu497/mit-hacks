<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonkeyForge — draw a superpower</title>
<style>
  :root {
    --bg: #14161c; --panel: #1d212b; --line: #2e3442;
    --ink: #e8ecf4; --muted: #9aa4b8; --accent: #57b9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .cols { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; flex: 1 1 340px; min-width: 0;
  }
  canvas {
    width: 100%; max-width: 100%; aspect-ratio: 1; background: #fff;
    border-radius: 8px; touch-action: none; cursor: crosshair; display: block;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 180px; min-width: 0; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: #11131a; color: var(--ink); font: inherit;
  }
  button {
    padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line);
    background: #262c38; color: var(--ink); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07121a; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .verdict { font-size: 17px; font-weight: 600; margin: 0 0 4px; min-height: 26px; }
  .detail { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .icon { display: block; width: 210px; max-width: 100%; margin: 0 auto 16px; }
  .bar { display: grid; grid-template-columns: 88px 1fr 46px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .track { height: 8px; background: #11131a; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .25s; }
  .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warn { color: #f0c04a; }
  .err { color: #f08a7a; }
  .placeholder { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Draw a superpower</h1>
  <p class="sub">Sketch it, say what it does, and MonkeyForge picks one of the four runtime
    powers and builds the badge. Generator: <span id="gen">…</span></p>

  <div class="cols">
    <div class="card">
      <canvas id="pad" width="512" height="512"></canvas>
      <div class="row">
        <input id="desc" type="text" placeholder="…and what does it do?" autocomplete="off">
      </div>
      <div class="row">
        <button class="primary" id="go">Make my icon</button>
        <button id="clear">Clear</button>
        <button id="undo">Undo</button>
      </div>
    </div>

    <div class="card">
      <div id="out"><p class="placeholder">Your icon will appear here.</p></div>
    </div>
  </div>
</div>

<script>
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
const out = document.getElementById('out');
const strokes = [];
let current = null;

function redraw() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, pad.width, pad.height);
  ctx.strokeStyle = '#1d1f26';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const stroke of strokes) {
    if (stroke.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for (const p of stroke.slice(1)) ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}
redraw();

function at(event) {
  const box = pad.getBoundingClientRect();
  return {
    x: (event.clientX - box.left) * pad.width / box.width,
    y: (event.clientY - box.top) * pad.height / box.height,
  };
}
pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId);
  current = [at(e)];
  strokes.push(current);
});
pad.addEventListener('pointermove', e => { if (current) { current.push(at(e)); redraw(); } });
addEventListener('pointerup', () => { current = null; });

document.getElementById('clear').onclick = () => { strokes.length = 0; redraw(); };
document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); };

fetch('health').then(r => r.json())
  .then(d => { document.getElementById('gen').textContent = d.generator; })
  .catch(() => { document.getElementById('gen').textContent = 'unavailable'; });

const NAMES = { beam_blast: 'Beam Blast', freeze_ray: 'Freeze Ray', boost: 'Boost', slow: 'Slow' };
const COLORS = { beam_blast: '#F0483C', freeze_ray: '#3FC6F0', boost: '#F5C518', slow: '#8A5BD6' };

document.getElementById('go').onclick = async () => {
  const button = document.getElementById('go');
  const description = document.getElementById('desc').value.trim();
  if (!strokes.length && !description) {
    out.innerHTML = '<p class="placeholder err">Draw something, or describe it.</p>';
    return;
  }
  button.disabled = true;
  out.innerHTML = '<p class="placeholder">Generating…</p>';

  const blob = await new Promise(resolve => pad.toBlob(resolve, 'image/png'));
  const body = new FormData();
  if (strokes.length) body.append('sketch', blob, 'sketch.png');
  body.append('description', description);

  try {
    const response = await fetch('v1/power-icon', { method: 'POST', body });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({ detail: response.statusText }));
      throw new Error(detail.detail || 'request failed');
    }
    const data = await response.json();
    const order = Object.entries(data.scores).sort((a, b) => b[1] - a[1]);
    out.innerHTML = `
      <img class="icon" src="${data.icon}" alt="${data.display_name} icon">
      <p class="verdict${data.unsure ? ' warn' : ''}">${data.message}</p>
      <p class="detail">${data.effect}<br>
        Cooldown ${data.cooldown_seconds}s · read as “${data.motif}” · ${data.generator}</p>
      ${order.map(([id, score]) => `
        <div class="bar">
          <span>${NAMES[id] || id}</span>
          <span class="track"><span class="fill" style="width:${(score * 100).toFixed(1)}%;background:${COLORS[id]}"></span></span>
          <span class="pct">${(score * 100).toFixed(0)}%</span>
        </div>`).join('')}
    `;
  } catch (error) {
    out.innerHTML = `<p class="placeholder err">${error.message}</p>`;
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
