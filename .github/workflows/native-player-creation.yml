name: Native player creation

on:
  push:
    branches: [coaching, native-coaching, native-player-creation]
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `stable`, not an exact pin. Both workflows pinned one, and the pin is what kept breaking:
      # 1.75 could not read the crate's own lockfile (v4 needs Cargo 1.78+), and 1.85 is refused
      # outright by transitive deps -- `icu_*` 2.3, pulled in through `url`, requires rustc 1.88.
      # An exact pin has to be chased every time a dependency raises its floor, and it was not
      # being chased.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/player-creation
      - name: Format
        run: cargo fmt --manifest-path native/player-creation/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path native/player-creation/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path native/player-creation/Cargo.toml
