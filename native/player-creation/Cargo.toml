[package]
name = "tactic-lab-player-creation"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tactic_lab_player_creation"
path = "src/lib.rs"

[[bin]]
name = "native-player-creation"
path = "src/bin/native-player-creation.rs"

[dependencies]
anyhow = "=1.0.86"
bevy = { version = "=0.13.2", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_winit",
  "default_font",
  "multi-threaded",
  "png",
  "x11",
] }
bevy_egui = { version = "=0.25.0", default-features = false, features = ["default_fonts", "manage_clipboard", "render"] }
humantime = "=2.1.0"
image = { version = "=0.24.9", default-features = false, features = ["png"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.12.0"
