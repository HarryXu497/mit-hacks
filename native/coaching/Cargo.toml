[package]
name = "tactic-lab-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "tactic_lab_native"
path = "src/lib.rs"

[[bin]]
name = "native-coaching"
path = "src/bin/native-coaching.rs"

[dependencies]
anyhow = "=1.0.86"
base64 = "=0.22.1"
bevy = { version = "=0.13.2", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_winit",
  "default_font",
  "multi-threaded",
  "png",
  "x11",
] }
bevy_egui = { version = "=0.25.0", default-features = false, features = ["default_fonts", "manage_clipboard", "render"] }
cpal = "=0.15.3"
crossbeam-channel = "=0.5.13"
dirs = "=5.0.1"
futures-util = "=0.3.30"
humantime = "=2.1.0"
reqwest = { version = "=0.12.5", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots"] }
url = "=2.5.2"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.12.0"
